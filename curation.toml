# What counts as an episode.
#
# JASON: THIS FILE IS A PROPOSAL AND NEEDS YOUR EYE. Change any `decision` to "include"
# or "exclude" and re-run build_data.py and build_site.py. Nothing here deletes anything;
# an excluded upload stays in the data and is listed at the bottom of the site's data
# file, it just does not count as an episode or feed the figures.
#
# WHY THIS EXISTS. Both YouTube playlists carry uploads that are not the show. Left in,
# they inflated the numbers a sponsor reads: 35 unnumbered entries held 998k of the
# 1.72M views, and the three most-watched things on the site were a Mike Rowe commentary,
# a two-minute TV-news clip and an AI news short. "Most watched" sorted them to the top,
# so the first thing a sponsor clicked was not the podcast.
#
# THE DEFAULT IS NOW OUT. Jason looked at the preview and said a lot of what was listed
# was not from the podcast, so an upload counts as an episode only if its title carries
# an episode number or the show's name, or it matches an item in the podcast RSS feed.
# Everything else is excluded, including 23 uploads an earlier pass had argued for.
#
# Their reasons are kept below exactly as they were written, because several are
# genuinely arguable - the two Unity leadership interviews above all - and the reason is
# what Jason needs in order to rescue one. To bring an upload back, change its decision
# to "include" and re-run build_data.py and build_site.py.

