# The Game Dev Show tag taxonomy.
#
# THIS FILE IS THE ONE TO EDIT. The tagger reads it, matches `terms` against each
# episode's English captions, and gives an episode a tag only when the hit count reaches
# `min_hits`. Every tag it applies stores the timestamps where the terms were said, so a
# tag on the site can always be checked against the episode.
#
# Fields:
#   id       slug used in URLs and filters
#   label    what a visitor sees
#   group    how the filter bar is organised
#   terms    phrases to match, lowercased; word-boundary matched, so "ecs" will not fire
#            inside "specs"
#   exclude  phrases that cancel a hit on the same line, for terms with a common
#            innocent meaning
#   min_hits how many hits before the tag sticks. Raise it for a term that gets said in
#            passing, lower it for one that is always significant when mentioned.
#   query    the phrase used to measure search demand, when it differs from the label

[[tag]]
id = "unity"
label = "Unity"
group = "Engines"
terms = ["unity", "unity3d", "unity engine", "unity editor"]
min_hits = 8
query = "unity game development"

