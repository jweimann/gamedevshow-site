# Who is on The Game Dev Show.
#
# JASON: THIS IS THE FILE TO EDIT. Add, remove or rename anyone; re-run build_site.py
# (two seconds - no data rebuild needed). Nothing here is inferred: every name is one you
# gave us, or one written into an episode's own credits or on screen in its stream tiles.
#
# `confirmed = false` keeps a person OFF the site while a question about them is open.
#
# WHY THE ROSTER IS STATED RATHER THAN DETECTED. Four ways of reading the panel out of the
# episodes were tried and all four were wrong in ways that would not have shown on the page:
#
#   * mentions in captions      David is credited on every episode whose description names
#                               the panel and is said aloud in one of them.
#   * full names in openings    The show reads a roll call of FIRST names, so pairing
#                               adjacent capitals invented people - "Greg Andrew",
#                               "Powell Jason", and "Andrew Lana" out of an episode where
#                               Andrew and Lana were both really there.
#   * every credit line         Mostly Unity Asset Store products, and the two biggest
#                               "credits" were a pasted footer appearing on videos that are
#                               not even episodes.
#   * loose name aliases        "wolf" matched a game asset in eighteen episodes.
#
# And the CoHosts heading is boilerplate too: the six episodes carrying it credit the same
# trio, while the stream tiles show Greg on all three sampled and David on none.
#
# CHANNELS. Every link below was resolved from the live channel page and cross-checked
# against a name label read off a stream tile, so the channel matches the person. Where
# no source gives a channel, the entry says so rather than guessing - a wrong channel link
# on a public page is worse than no link.

