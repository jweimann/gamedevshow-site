# Who is on The Game Dev Show.
#
# JASON: THIS IS THE FILE TO EDIT. Add, remove or rename anyone, then run
# `python tools/build_site.py` (two seconds). Nothing here is inferred: every name is one
# you gave us, one written into an episode's credits, or one READ OFF THE STREAM TILE in
# the episode itself - and the tile ones were each checked against the frame by eye
# before being written down.
#
# `confirmed = false` keeps someone off the site while a question about them is open.
# `link_needed = true` means no source gives them a channel, so nothing is linked. A wrong
# channel link on a public page is worse than no link.
#
# WHY THE ROSTER IS STATED, NOT DETECTED FROM CAPTIONS. Four caption approaches were tried
# and all four were wrong in ways that would not have shown on the page: mentions (David
# is credited on every episode naming the panel and spoken in one), full names in openings
# (the show reads a roll call of FIRST names, so pairing capitals invented "Greg Andrew"
# and "Powell Jason"), every description credit line (asset-store products, plus a pasted
# footer appearing on videos that are not episodes), and loose aliases ("wolf" matched a
# game asset in eighteen episodes). The stream tiles are the source that actually works.

